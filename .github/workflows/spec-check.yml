name: Spec integrity check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to check (for manual runs)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  spec-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install PyGithub pydantic requests

      - name: Run spec checker
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python spec_checker/run.py --mock

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: findings.json
          retention-days: 7